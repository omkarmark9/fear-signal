[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fear-signal"
version = "2.0.0"
description = "Causal, price-only fear index for AI stocks (2023-01-03 onward) built on a zero-inflated, censored half-normal hidden Markov model."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pyarrow>=14",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
fearsignal = "fearsignal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
